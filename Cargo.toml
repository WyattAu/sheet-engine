[package]
name = "sheet-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/sheet-engine"
homepage = "https://github.com/WyattAu/sheet-engine"
documentation = "https://docs.rs/sheet-engine"
description = "Spreadsheet calculation engine — dependency-driven incremental recalculation, Excel-compatible semantics, volatile function tracking"
readme = "README.md"
keywords = ["spreadsheet", "formula", "engine", "excel", "recalculation"]
categories = ["data-structures", "parser-implementations"]
exclude = [".github/", "benches/", "supply-chain/"]

# Layer model: docs/layers.md in WyattAu/engineering-standards.
# L2 — domain: composes formula-lang (L0), sheet-core (L1), sheet-xlsx (L1).
[package.metadata.layers]
tier = "L2"

# The only dependencies are the three domain crates — no auxiliary runtime
# dependencies. Error types hand-roll their `Display` to keep it that way.
[dependencies]
formula-lang = "0.1"
sheet-core = "0.1"
sheet-xlsx = "0.1"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "recalc_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
